name: Validate
on: [push, pull_request]
jobs:
  node:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtommath1 libncurses6
      - run: npm ci
      - run: npm run setup:firebird
      - run: npm run build
      - run: npm test
